<!DOCTYPE html>
<!-- File: app/static/graph.html -->
<!-- 사람이 보는 그래프 뷰. /graph(JSON)를 받아 force-graph로 노드/엣지를 그린다. -->
<!-- /cleanup/candidates로 중복 후보 쌍을 빨갛게 강조한다. 빌드툴 없음(CDN 단일 페이지). -->
<!-- UI는 한/영 전환(브라우저 언어 자동 + KO/EN 토글, localStorage 기억). -->
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Second Brain — 그래프</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0e14; color: #cdd6f4;
    font-family: system-ui, "Segoe UI", "Malgun Gothic", sans-serif; }
  #graph { width: 100vw; height: 100vh; }
  #hud { position: fixed; top: 12px; left: 14px; z-index: 10; font-size: 13px; line-height: 1.7;
    background: rgba(11,14,20,0.55); padding: 10px 12px; border-radius: 10px;
    border: 1px solid #1b2230; backdrop-filter: blur(3px); }
  .hud-top { display: flex; align-items: center; gap: 8px; }
  #hud-title { font-size: 16px; font-weight: 700; }
  #lang-toggle { margin-left: auto; background: #1f2733; color: #cdd6f4; border: 1px solid #313b4d;
    border-radius: 6px; padding: 2px 9px; font-size: 11px; font-weight: 600; cursor: pointer; }
  #lang-toggle:hover { background: #2a3543; }
  #stat { color: #9399b2; margin: 4px 0; }
  .legend { margin-top: 5px; }
  .legend-title { color: #6b7280; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.04em; margin: 7px 0 2px; }
  .legend span { margin-right: 12px; white-space: nowrap; }
  .legend em { color: #9399b2; font-style: normal; font-size: 11px; margin-left: 3px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    vertical-align: middle; margin-right: 4px; }
  .line { display: inline-block; width: 14px; height: 0; vertical-align: middle; margin-right: 4px;
    border-top-width: 3px; border-top-style: solid; }
  #ask { position: fixed; left: 14px; bottom: 14px; z-index: 10; width: 360px; max-width: 46vw; }
  #ask-answer { display: none; background: #11151f; border: 1px solid #1f2733;
    border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px;
    max-height: 40vh; overflow-y: auto; }
  #ask-answer .ans { white-space: pre-wrap; line-height: 1.6; }
  #ask-answer .srcs { margin-top: 8px; color: #9399b2; font-size: 12px; }
  #ask-answer .src { display: inline-block; background: #1f2733; border-radius: 4px;
    padding: 1px 6px; margin: 2px 3px 0 0; }
  #ask-answer .muted { color: #9399b2; }
  #ask-bar { display: flex; gap: 6px; }
  #ask-input { flex: 1; background: #11151f; color: #cdd6f4; border: 1px solid #1f2733;
    border-radius: 8px; padding: 8px 10px; font-size: 13px; outline: none; }
  #ask-input:focus { border-color: #89b4fa; }
  #ask-btn { background: #89b4fa; color: #0b0e14; border: none; border-radius: 8px;
    padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
  #ask-btn:disabled { opacity: 0.5; cursor: default; }
  #ask-answer .src { cursor: pointer; }
  #detail { position: fixed; top: 14px; right: 14px; z-index: 10; width: 340px; max-width: 42vw;
    max-height: calc(100vh - 28px); overflow-y: auto; display: none;
    background: #11151f; border: 1px solid #1f2733; border-radius: 8px; padding: 14px 16px; }
  #detail .dt-close { float: right; cursor: pointer; color: #9399b2; font-size: 16px; line-height: 1; }
  #detail .dt-title { font-size: 15px; font-weight: 600; margin-right: 8px; }
  #detail .dt-badge { display: inline-block; border-radius: 4px; padding: 1px 7px;
    font-size: 12px; font-weight: 600; color: #0b0e14; vertical-align: middle; }
  #detail .dt-meta { color: #9399b2; font-size: 12px; margin: 6px 0 10px; word-break: break-all; }
  #detail .dt-body { white-space: pre-wrap; line-height: 1.6; font-size: 13px;
    border-top: 1px solid #1f2733; padding-top: 10px; }
  #detail .dt-links { margin-top: 12px; border-top: 1px solid #1f2733; padding-top: 10px;
    font-size: 12px; color: #9399b2; }
  #detail .dt-link { display: inline-block; background: #1f2733; border-radius: 4px;
    padding: 2px 7px; margin: 3px 4px 0 0; cursor: pointer; color: #cdd6f4; }
  #detail .dt-link:hover { background: #2a3543; }
</style>
</head>
<body>
<div id="hud">
  <div class="hud-top">
    <b id="hud-title">🧠 Second Brain</b>
    <button id="lang-toggle">EN</button>
  </div>
  <div id="stat"></div>
  <div id="legend-area"></div>
</div>
<div id="graph"></div>
<div id="ask">
  <div id="ask-answer"></div>
  <div id="ask-bar">
    <input id="ask-input" autocomplete="off" />
    <button id="ask-btn"></button>
  </div>
</div>
<div id="detail"></div>
<script src="https://unpkg.com/force-graph"></script>
<script>
const idOf = x => (x && typeof x === 'object') ? x.id : x;  // force-graph가 source/target을 객체로 바꿈
const truncate = (s, n) => { const a = [...String(s)]; return a.length > n ? a.slice(0, n).join('') + '…' : s; };

// ── i18n: 노드 유형/관계는 데이터 값(한국어)이라 표시만 매핑한다 ──
const I18N = {
  ko: {
    title: "🧠 Second Brain",
    loading: "불러오는 중…",
    stat: (n, e, dup) => `${n} 노드 · ${e} 엣지${dup ? ` · ⚠ 정리 후보 ${dup}쌍` : ''}`,
    legendNode: "노드 — 노트 유형", legendLink: "선 — 연결", legendRel: "선 — 의미 관계",
    types: { '의미': '의미', '통찰': '통찰', '절차': '절차', unclassified: '미분류' },
    typeDesc: { '의미': '개념·정의', '통찰': '판단·결정', '절차': '방법·설정' },
    links: { wiki: '위키링크', sim: '의미 유사', dup: '정리 후보' },
    linkDesc: { wiki: '직접 연결', sim: '비슷한 내용', dup: '중복 의심' },
    rels: { '지지': '지지', '반박': '반박', '확장': '확장' },
    relDesc: { '지지': '뒷받침', '반박': '충돌', '확장': '구체화' },
    askPlaceholder: "내 뇌에 질문…(Enter)", askBtn: "묻기", thinking: "생각 중…",
    evidence: "근거: ", askFail: "질문 실패: ", graphFail: "그래프 로드 실패: ",
    noteFail: "노트 로드 실패: ", connected: "🔗 연결: ", emptyNote: "(빈 노트)",
  },
  en: {
    title: "🧠 Second Brain",
    loading: "Loading…",
    stat: (n, e, dup) => `${n} nodes · ${e} edges${dup ? ` · ⚠ ${dup} cleanup pairs` : ''}`,
    legendNode: "Nodes — note type", legendLink: "Edges — links", legendRel: "Edges — relations",
    types: { '의미': 'Concept', '통찰': 'Insight', '절차': 'Procedure', unclassified: 'Unclassified' },
    typeDesc: { '의미': 'definition', '통찰': 'judgment', '절차': 'how-to' },
    links: { wiki: 'Wiki-link', sim: 'Similar', dup: 'Cleanup' },
    linkDesc: { wiki: 'direct', sim: 'related', dup: 'duplicate' },
    rels: { '지지': 'Supports', '반박': 'Refutes', '확장': 'Expands' },
    relDesc: { '지지': 'backs up', '반박': 'conflicts', '확장': 'elaborates' },
    askPlaceholder: "Ask your brain…(Enter)", askBtn: "Ask", thinking: "Thinking…",
    evidence: "Sources: ", askFail: "Ask failed: ", graphFail: "Graph load failed: ",
    noteFail: "Note load failed: ", connected: "🔗 Linked: ", emptyNote: "(empty note)",
  },
};
function detectLang() {
  const saved = localStorage.getItem('sb_lang');
  if (saved === 'ko' || saved === 'en') return saved;
  return (navigator.language || '').toLowerCase().startsWith('ko') ? 'ko' : 'en';
}
let LANG = detectLang();
const t = () => I18N[LANG];

// 그래프 인스턴스/데이터 + 통계(언어 전환 시 다시 그리기 위해 보관)
let GRAPH = null, NODES = [], LINKS = [];
let STAT = { n: 0, e: 0, dup: 0 }, LOADED = false;

function renderStat() {
  document.getElementById('stat').textContent =
    LOADED ? t().stat(STAT.n, STAT.e, STAT.dup) : t().loading;
}

function legendRow(items) {
  const div = document.createElement('div');
  div.className = 'legend';
  for (const it of items) {
    const span = document.createElement('span');
    const marker = document.createElement('i');
    marker.className = it.line ? 'line' : 'dot';
    if (it.line) marker.style.borderColor = it.color; else marker.style.background = it.color;
    span.appendChild(marker);
    span.appendChild(document.createTextNode(it.label));
    if (it.desc) {
      const em = document.createElement('em');
      em.textContent = it.desc;
      span.appendChild(em);
    }
    div.appendChild(span);
  }
  return div;
}

function renderLegend() {
  const L = t();
  const area = document.getElementById('legend-area');
  area.replaceChildren();
  const title = txt => { const d = document.createElement('div'); d.className = 'legend-title'; d.textContent = txt; return d; };
  area.append(
    title(L.legendNode),
    legendRow([
      { color: '#89b4fa', label: L.types['의미'], desc: L.typeDesc['의미'] },
      { color: '#f9e2af', label: L.types['통찰'], desc: L.typeDesc['통찰'] },
      { color: '#a6e3a1', label: L.types['절차'], desc: L.typeDesc['절차'] },
      { color: '#6b7280', label: L.types.unclassified },
    ]),
    title(L.legendLink),
    legendRow([
      { line: true, color: '#4ade80', label: L.links.wiki, desc: L.linkDesc.wiki },
      { line: true, color: '#64748b', label: L.links.sim, desc: L.linkDesc.sim },
      { line: true, color: '#ef4444', label: L.links.dup, desc: L.linkDesc.dup },
    ]),
    title(L.legendRel),
    legendRow([
      { line: true, color: '#2dd4bf', label: L.rels['지지'], desc: L.relDesc['지지'] },
      { line: true, color: '#fb923c', label: L.rels['반박'], desc: L.relDesc['반박'] },
      { line: true, color: '#c084fc', label: L.rels['확장'], desc: L.relDesc['확장'] },
    ]),
  );
}

function applyLang() {
  const L = t();
  document.documentElement.lang = LANG;
  document.getElementById('hud-title').textContent = L.title;
  document.getElementById('lang-toggle').textContent = (LANG === 'ko') ? 'EN' : '한';
  askInput.placeholder = L.askPlaceholder;
  askBtn.textContent = L.askBtn;
  renderLegend();
  renderStat();
  if (GRAPH) GRAPH.nodeRelSize(GRAPH.nodeRelSize());  // 캔버스 라벨(관계/배지) 리렌더 트리거
}

Promise.all([
  fetch('/graph').then(r => r.json()),
  fetch('/cleanup/candidates?threshold=0.85').then(r => r.json()).catch(() => ({ candidates: [] })),
])
  .then(([data, cleanup]) => {
    // 중복 후보 쌍 → 빨간 dup 링크. 같은 쌍의 의미유사 엣지는 제거(이중 표시 방지).
    const dupKey = (a, b) => [a, b].sort().join('||');
    const dupSet = new Set();
    const dupLinks = (cleanup.candidates || []).map(c => {
      dupSet.add(dupKey(c.a.path, c.b.path));
      return { source: c.a.path, target: c.b.path, type: 'dup', weight: c.score };
    });
    const links = data.edges
      .filter(e => !(e.type === 'similar' && dupSet.has(dupKey(e.source, e.target))))
      .map(e => ({ ...e }))
      .concat(dupLinks);

    STAT = { n: data.nodes.length, e: links.length, dup: dupLinks.length };
    LOADED = true;
    renderStat();

    // 연결 수(degree) → 노드 크기에 반영(중요한 노드일수록 크게). 라벨 표시 기준에도 사용.
    const deg = {};
    data.nodes.forEach(n => { deg[n.id] = 0; });
    links.forEach(l => { deg[l.source] = (deg[l.source] || 0) + 1; deg[l.target] = (deg[l.target] || 0) + 1; });
    data.nodes.forEach(n => { n.__deg = deg[n.id] || 0; });

    // 노드 유형별 색 (의미/통찰/절차, 미분류는 회색)
    const TYPE_COLORS = { '의미': '#89b4fa', '통찰': '#f9e2af', '절차': '#a6e3a1' };
    const colorFor = ty => TYPE_COLORS[ty] || '#6b7280';
    // 의미 관계 엣지 색 (지지/반박/확장 — 무관은 엣지가 없음)
    const REL_COLORS = { '지지': '#2dd4bf', '반박': '#fb923c', '확장': '#c084fc' };
    const NODE_REL = 4;
    const radiusOf = n => NODE_REL * Math.sqrt(1 + n.__deg * 0.6);
    const labelAlways = data.nodes.length <= 25;

    let hoverId = null;
    let neighbors = new Set();

    const g = ForceGraph()(document.getElementById('graph'))
      .graphData({ nodes: data.nodes, links })
      .backgroundColor('#0b0e14')
      .nodeRelSize(NODE_REL)
      .nodeVal(n => 1 + n.__deg * 0.6)
      .nodeColor(n => {
        const c = colorFor(n.type);
        return (hoverId && !neighbors.has(n.id)) ? c + '26' : c;
      })
      .linkColor(l => {
        const c = l.type === 'link' ? '#4ade80' : l.type === 'dup' ? '#ef4444'
          : l.type === 'relation' ? (REL_COLORS[l.label] || '#94a3b8') : '#475569';
        if (hoverId) {
          const s = idOf(l.source), tt = idOf(l.target);
          if (!(neighbors.has(s) && neighbors.has(tt))) return c + '14';
        }
        return c;
      })
      .linkWidth(l => l.type === 'dup' ? 4 : l.type === 'relation' ? 2.5
        : l.type === 'similar' ? (l.weight || 0.5) * 2 : 1.8)
      .linkDirectionalParticles(l => l.type === 'link' ? 2 : 0)
      .linkDirectionalParticleWidth(2)
      .linkCanvasObjectMode(l => l.type === 'relation' ? 'after' : undefined)
      .linkCanvasObject((l, ctx, scale) => {
        // 관계 엣지 중앙에 라벨(지지/반박/확장 → 선택 언어). 호버 시 비관련은 흐리게.
        const s = l.source, tt = l.target;
        if (l.type !== 'relation' || typeof s !== 'object' || typeof tt !== 'object') return;
        const dim = hoverId && !(neighbors.has(s.id) && neighbors.has(tt.id));
        const fs = 10 / scale;
        ctx.font = `${fs}px system-ui, "Malgun Gothic", sans-serif`;
        ctx.fillStyle = (REL_COLORS[l.label] || '#94a3b8') + (dim ? '20' : '');
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(t().rels[l.label] || l.label, (s.x + tt.x) / 2, (s.y + tt.y) / 2);
      })
      .nodeCanvasObjectMode(() => 'after')
      .nodeCanvasObject((n, ctx, scale) => {
        const isNeighbor = hoverId && neighbors.has(n.id);
        const dimmed = hoverId && !neighbors.has(n.id);
        if (!(labelAlways || isNeighbor || scale > 1.4 || n.__deg >= 3)) return;
        const label = (hoverId === n.id) ? (n.label || n.id) : truncate(n.label || n.id, 16);
        const fs = 12 / scale;
        ctx.font = `${fs}px system-ui, "Malgun Gothic", sans-serif`;
        const w = ctx.measureText(label).width;
        const padX = 4 / scale, padY = 2.5 / scale;
        const x = n.x;
        const y = n.y + radiusOf(n) + 3 / scale;
        ctx.fillStyle = dimmed ? 'rgba(17,21,31,0.35)' : 'rgba(17,21,31,0.82)';
        const bw = w + padX * 2, bh = fs + padY * 2, bx = x - bw / 2, by = y;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 3 / scale);
        else ctx.rect(bx, by, bw, bh);
        ctx.fill();
        ctx.fillStyle = dimmed ? '#cdd6f455' : (isNeighbor ? '#ffffff' : '#cdd6f4');
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText(label, x, y + padY);
      })
      .onNodeHover(node => {
        hoverId = node ? node.id : null;
        neighbors = new Set();
        if (node) {
          neighbors.add(node.id);
          links.forEach(l => {
            const s = idOf(l.source), tt = idOf(l.target);
            if (s === node.id) neighbors.add(tt);
            if (tt === node.id) neighbors.add(s);
          });
        }
        document.getElementById('graph').style.cursor = node ? 'pointer' : 'default';
      })
      .onNodeClick(n => { g.centerAt(n.x, n.y, 600); g.zoom(4, 600); showDetail(n); });

    // 시뮬레이션이 처음 안정되면 전체 그래프가 화면에 들어오게 1회 맞춤(좌우 잘림 방지).
    let fitted = false;
    g.onEngineStop(() => { if (!fitted) { fitted = true; g.zoomToFit(500, 90); } });

    GRAPH = g;
    NODES = data.nodes;
    LINKS = links;
  })
  .catch(err => {
    document.getElementById('stat').textContent = t().graphFail + err;
  });

// ── 질문(RAG /ask): 노트를 검색해 로컬 LLM이 근거 기반으로 답한다 ──
const askInput = document.getElementById('ask-input');
const askBtn = document.getElementById('ask-btn');
const askAnswer = document.getElementById('ask-answer');

// textContent로만 채워 XSS를 원천 차단(LLM 답변·노트 제목은 신뢰 못 할 입력).
function renderMuted(text) {
  askAnswer.replaceChildren();
  const m = document.createElement('div');
  m.className = 'muted';
  m.textContent = text;
  askAnswer.appendChild(m);
}

function renderAnswer(answer, sources) {
  askAnswer.replaceChildren();
  const ans = document.createElement('div');
  ans.className = 'ans';
  ans.textContent = answer;
  askAnswer.appendChild(ans);
  if (sources && sources.length) {
    const srcs = document.createElement('div');
    srcs.className = 'srcs';
    srcs.append(t().evidence);
    for (const s of sources) {
      const chip = document.createElement('span');
      chip.className = 'src';
      chip.textContent = s.heading || s.path;
      chip.addEventListener('click', () => focusNode(s.path));
      srcs.append(chip, ' ');
    }
    askAnswer.appendChild(srcs);
  }
}

async function doAsk() {
  const q = askInput.value.trim();
  if (!q) return;
  askBtn.disabled = true;
  askAnswer.style.display = 'block';
  renderMuted(t().thinking);
  try {
    const r = await fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: q }),
    });
    const data = await r.json();
    renderAnswer(data.answer || '', data.sources || []);
  } catch (e) {
    renderMuted(t().askFail + e);
  } finally {
    askBtn.disabled = false;
  }
}
askBtn.addEventListener('click', doAsk);
askInput.addEventListener('keydown', e => { if (e.key === 'Enter') doAsk(); });

// ── 노드 상세 패널(T1): 클릭한 노트의 본문·메타·연결을 측면에 띄운다 ──
const detailEl = document.getElementById('detail');
const TYPE_BADGE = { '의미': '#89b4fa', '통찰': '#f9e2af', '절차': '#a6e3a1' };

function focusNode(id) {
  const n = NODES.find(x => x.id === id);
  if (!n) return;
  if (GRAPH && n.x != null) { GRAPH.centerAt(n.x, n.y, 600); GRAPH.zoom(4, 600); }
  showDetail(n);
}

async function showDetail(node) {
  detailEl.style.display = 'block';
  detailEl.replaceChildren();
  const muted = document.createElement('div');
  muted.style.color = '#9399b2';
  muted.textContent = t().loading;
  detailEl.appendChild(muted);
  try {
    const r = await fetch('/note?path=' + encodeURIComponent(node.id));
    if (!r.ok) throw new Error('not found');
    renderDetail(await r.json(), node);
  } catch (e) {
    muted.textContent = t().noteFail + e;
  }
}

function renderDetail(d, node) {
  detailEl.replaceChildren();

  const close = document.createElement('span');
  close.className = 'dt-close';
  close.textContent = '✕';
  close.addEventListener('click', () => { detailEl.style.display = 'none'; });
  detailEl.appendChild(close);

  const head = document.createElement('div');
  const title = document.createElement('span');
  title.className = 'dt-title';
  title.textContent = d.title || node.id;
  head.appendChild(title);
  if (d.type) {
    const badge = document.createElement('span');
    badge.className = 'dt-badge';
    badge.style.background = TYPE_BADGE[d.type] || '#6b7280';
    badge.textContent = t().types[d.type] || d.type;   // 유형 배지도 선택 언어로 표시
    head.appendChild(badge);
  }
  detailEl.appendChild(head);

  const meta = document.createElement('div');
  meta.className = 'dt-meta';
  const bits = [];
  if (d.tags && d.tags.length) bits.push('🏷 ' + d.tags.join(', '));
  if (d.created) bits.push('📅 ' + d.created);
  bits.push(d.path);
  meta.textContent = bits.join(' · ');
  detailEl.appendChild(meta);

  const body = document.createElement('div');
  body.className = 'dt-body';
  body.textContent = d.body || t().emptyNote;
  detailEl.appendChild(body);

  // 위키링크 엣지로 연결된 노트 → 클릭하면 그 노드로 점프
  const connected = [...new Set(LINKS
    .filter(l => l.type === 'link' && (idOf(l.source) === node.id || idOf(l.target) === node.id))
    .map(l => idOf(l.source) === node.id ? idOf(l.target) : idOf(l.source)))];
  if (connected.length) {
    const wrap = document.createElement('div');
    wrap.className = 'dt-links';
    wrap.append(t().connected);
    for (const id of connected) {
      const n = NODES.find(x => x.id === id);
      const chip = document.createElement('span');
      chip.className = 'dt-link';
      chip.textContent = (n && n.label) || id;
      chip.addEventListener('click', () => focusNode(id));
      wrap.append(chip, ' ');
    }
    detailEl.appendChild(wrap);
  }
}

// ── 언어 토글 + 초기 적용 (모든 요소 정의 후) ──
document.getElementById('lang-toggle').addEventListener('click', () => {
  LANG = (LANG === 'ko') ? 'en' : 'ko';
  localStorage.setItem('sb_lang', LANG);
  applyLang();
});
applyLang();
</script>
</body>
</html>
