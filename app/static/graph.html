<!DOCTYPE html>
<!-- File: app/static/graph.html -->
<!-- 사람이 보는 그래프 뷰. /graph(JSON)를 받아 force-graph로 노드/엣지를 그린다. -->
<!-- /cleanup/candidates로 중복 후보 쌍을 빨갛게 강조한다. 빌드툴 없음(CDN 단일 페이지). -->
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Second Brain — 그래프</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0e14; color: #cdd6f4;
    font-family: system-ui, "Segoe UI", "Malgun Gothic", sans-serif; }
  #graph { width: 100vw; height: 100vh; }
  #hud { position: fixed; top: 12px; left: 14px; z-index: 10; font-size: 13px; line-height: 1.7; }
  #hud b { font-size: 16px; }
  #stat { color: #9399b2; }
  .legend span { margin-right: 12px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    vertical-align: middle; margin-right: 4px; }
  #ask { position: fixed; left: 14px; bottom: 14px; z-index: 10; width: 360px; max-width: 46vw; }
  #ask-answer { display: none; background: #11151f; border: 1px solid #1f2733;
    border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px;
    max-height: 40vh; overflow-y: auto; }
  #ask-answer .ans { white-space: pre-wrap; line-height: 1.6; }
  #ask-answer .srcs { margin-top: 8px; color: #9399b2; font-size: 12px; }
  #ask-answer .src { display: inline-block; background: #1f2733; border-radius: 4px;
    padding: 1px 6px; margin: 2px 3px 0 0; }
  #ask-answer .muted { color: #9399b2; }
  #ask-bar { display: flex; gap: 6px; }
  #ask-input { flex: 1; background: #11151f; color: #cdd6f4; border: 1px solid #1f2733;
    border-radius: 8px; padding: 8px 10px; font-size: 13px; outline: none; }
  #ask-input:focus { border-color: #89b4fa; }
  #ask-btn { background: #89b4fa; color: #0b0e14; border: none; border-radius: 8px;
    padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
  #ask-btn:disabled { opacity: 0.5; cursor: default; }
  #ask-answer .src { cursor: pointer; }
  #detail { position: fixed; top: 14px; right: 14px; z-index: 10; width: 340px; max-width: 42vw;
    max-height: calc(100vh - 28px); overflow-y: auto; display: none;
    background: #11151f; border: 1px solid #1f2733; border-radius: 8px; padding: 14px 16px; }
  #detail .dt-close { float: right; cursor: pointer; color: #9399b2; font-size: 16px; line-height: 1; }
  #detail .dt-title { font-size: 15px; font-weight: 600; margin-right: 8px; }
  #detail .dt-badge { display: inline-block; border-radius: 4px; padding: 1px 7px;
    font-size: 12px; font-weight: 600; color: #0b0e14; vertical-align: middle; }
  #detail .dt-meta { color: #9399b2; font-size: 12px; margin: 6px 0 10px; word-break: break-all; }
  #detail .dt-body { white-space: pre-wrap; line-height: 1.6; font-size: 13px;
    border-top: 1px solid #1f2733; padding-top: 10px; }
  #detail .dt-links { margin-top: 12px; border-top: 1px solid #1f2733; padding-top: 10px;
    font-size: 12px; color: #9399b2; }
  #detail .dt-link { display: inline-block; background: #1f2733; border-radius: 4px;
    padding: 2px 7px; margin: 3px 4px 0 0; cursor: pointer; color: #cdd6f4; }
  #detail .dt-link:hover { background: #2a3543; }
</style>
</head>
<body>
<div id="hud">
  <b>🧠 Second Brain</b>
  <div id="stat">불러오는 중…</div>
  <div class="legend">
    <span><i class="dot" style="background:#89b4fa"></i>의미</span>
    <span><i class="dot" style="background:#f9e2af"></i>통찰</span>
    <span><i class="dot" style="background:#a6e3a1"></i>절차</span>
    <span><i class="dot" style="background:#6b7280"></i>미분류</span>
  </div>
  <div class="legend">
    <span><i class="dot" style="background:#4ade80"></i>위키링크</span>
    <span><i class="dot" style="background:#64748b"></i>의미 유사</span>
    <span><i class="dot" style="background:#ef4444"></i>정리 후보(중복)</span>
  </div>
</div>
<div id="graph"></div>
<div id="ask">
  <div id="ask-answer"></div>
  <div id="ask-bar">
    <input id="ask-input" placeholder="내 뇌에 질문…(Enter)" autocomplete="off" />
    <button id="ask-btn">묻기</button>
  </div>
</div>
<div id="detail"></div>
<script src="https://unpkg.com/force-graph"></script>
<script>
Promise.all([
  fetch('/graph').then(r => r.json()),
  fetch('/cleanup/candidates?threshold=0.85').then(r => r.json()).catch(() => ({ candidates: [] })),
])
  .then(([data, cleanup]) => {
    // 중복 후보 쌍 → 빨간 dup 링크. 같은 쌍의 의미유사 엣지는 제거(이중 표시 방지).
    const dupKey = (a, b) => [a, b].sort().join('||');
    const dupSet = new Set();
    const dupLinks = (cleanup.candidates || []).map(c => {
      dupSet.add(dupKey(c.a.path, c.b.path));
      return { source: c.a.path, target: c.b.path, type: 'dup', weight: c.score };
    });
    const links = data.edges
      .filter(e => !(e.type === 'similar' && dupSet.has(dupKey(e.source, e.target))))
      .map(e => ({ ...e }))
      .concat(dupLinks);

    const dupTxt = dupLinks.length ? ` · ⚠ 정리 후보 ${dupLinks.length}쌍` : '';
    document.getElementById('stat').textContent =
      `${data.nodes.length} 노드 · ${links.length} 엣지${dupTxt}`;

    // 노드 유형별 색 (의미/통찰/절차, 미분류는 회색)
    const TYPE_COLORS = { '의미': '#89b4fa', '통찰': '#f9e2af', '절차': '#a6e3a1' };
    const colorFor = t => TYPE_COLORS[t] || '#6b7280';

    const g = ForceGraph()(document.getElementById('graph'))
      .graphData({ nodes: data.nodes, links })
      .backgroundColor('#0b0e14')
      .nodeRelSize(5)
      .nodeColor(n => colorFor(n.type))
      .linkColor(l => l.type === 'link' ? '#4ade80' : l.type === 'dup' ? '#ef4444' : '#475569')
      .linkWidth(l => l.type === 'dup' ? 4 : l.type === 'similar' ? (l.weight || 0.5) * 2 : 1.8)
      .linkDirectionalParticles(l => l.type === 'link' ? 2 : 0)
      .linkDirectionalParticleWidth(2)
      .nodeCanvasObjectMode(() => 'after')
      .nodeCanvasObject((n, ctx, scale) => {
        const label = n.label || n.id;
        const fs = 12 / scale;
        ctx.font = `${fs}px system-ui, "Malgun Gothic", sans-serif`;
        ctx.fillStyle = '#cdd6f4';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText(label, n.x, n.y + 6 / scale);
      })
      .onNodeClick(n => { g.centerAt(n.x, n.y, 600); g.zoom(4, 600); showDetail(n); });

    // 노드 상세 패널·점프가 참조하도록 그래프 인스턴스와 노드/엣지를 전역에 노출
    GRAPH = g;
    NODES = data.nodes;
    LINKS = links;
  })
  .catch(err => {
    document.getElementById('stat').textContent = '그래프 로드 실패: ' + err;
  });

// ── 질문(RAG /ask): 노트를 검색해 로컬 LLM이 근거 기반으로 답한다 ──
const askInput = document.getElementById('ask-input');
const askBtn = document.getElementById('ask-btn');
const askAnswer = document.getElementById('ask-answer');

// textContent로만 채워 XSS를 원천 차단(LLM 답변·노트 제목은 신뢰 못 할 입력).
function renderMuted(text) {
  askAnswer.replaceChildren();
  const m = document.createElement('div');
  m.className = 'muted';
  m.textContent = text;
  askAnswer.appendChild(m);
}

function renderAnswer(answer, sources) {
  askAnswer.replaceChildren();
  const ans = document.createElement('div');
  ans.className = 'ans';
  ans.textContent = answer;
  askAnswer.appendChild(ans);
  if (sources && sources.length) {
    const srcs = document.createElement('div');
    srcs.className = 'srcs';
    srcs.append('근거: ');
    for (const s of sources) {
      const chip = document.createElement('span');
      chip.className = 'src';
      chip.textContent = s.heading || s.path;
      chip.addEventListener('click', () => focusNode(s.path));
      srcs.append(chip, ' ');
    }
    askAnswer.appendChild(srcs);
  }
}

async function doAsk() {
  const q = askInput.value.trim();
  if (!q) return;
  askBtn.disabled = true;
  askAnswer.style.display = 'block';
  renderMuted('생각 중…');
  try {
    const r = await fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: q }),
    });
    const data = await r.json();
    renderAnswer(data.answer || '', data.sources || []);
  } catch (e) {
    renderMuted('질문 실패: ' + e);
  } finally {
    askBtn.disabled = false;
  }
}
askBtn.addEventListener('click', doAsk);
askInput.addEventListener('keydown', e => { if (e.key === 'Enter') doAsk(); });

// ── 노드 상세 패널(T1): 클릭한 노트의 본문·메타·연결을 측면에 띄운다 ──
// GRAPH/NODES/LINKS는 그래프가 그려진 뒤 then 안에서 채워진다(클릭은 그 후라 안전).
let GRAPH = null, NODES = [], LINKS = [];
const detailEl = document.getElementById('detail');
const TYPE_BADGE = { '의미': '#89b4fa', '통찰': '#f9e2af', '절차': '#a6e3a1' };
const idOf = x => (x && typeof x === 'object') ? x.id : x;  // force-graph가 source/target을 객체로 바꿈

function focusNode(id) {
  const n = NODES.find(x => x.id === id);
  if (!n) return;
  if (GRAPH && n.x != null) { GRAPH.centerAt(n.x, n.y, 600); GRAPH.zoom(4, 600); }
  showDetail(n);
}

async function showDetail(node) {
  detailEl.style.display = 'block';
  detailEl.replaceChildren();
  const muted = document.createElement('div');
  muted.style.color = '#9399b2';
  muted.textContent = '불러오는 중…';
  detailEl.appendChild(muted);
  try {
    const r = await fetch('/note?path=' + encodeURIComponent(node.id));
    if (!r.ok) throw new Error('노트를 찾을 수 없음');
    renderDetail(await r.json(), node);
  } catch (e) {
    muted.textContent = '노트 로드 실패: ' + e;
  }
}

function renderDetail(d, node) {
  detailEl.replaceChildren();

  const close = document.createElement('span');
  close.className = 'dt-close';
  close.textContent = '✕';
  close.addEventListener('click', () => { detailEl.style.display = 'none'; });
  detailEl.appendChild(close);

  const head = document.createElement('div');
  const title = document.createElement('span');
  title.className = 'dt-title';
  title.textContent = d.title || node.id;
  head.appendChild(title);
  if (d.type) {
    const badge = document.createElement('span');
    badge.className = 'dt-badge';
    badge.style.background = TYPE_BADGE[d.type] || '#6b7280';
    badge.textContent = d.type;
    head.appendChild(badge);
  }
  detailEl.appendChild(head);

  const meta = document.createElement('div');
  meta.className = 'dt-meta';
  const bits = [];
  if (d.tags && d.tags.length) bits.push('🏷 ' + d.tags.join(', '));
  if (d.created) bits.push('📅 ' + d.created);
  bits.push(d.path);
  meta.textContent = bits.join(' · ');
  detailEl.appendChild(meta);

  const body = document.createElement('div');
  body.className = 'dt-body';
  body.textContent = d.body || '(빈 노트)';
  detailEl.appendChild(body);

  // 위키링크 엣지로 연결된 노트 → 클릭하면 그 노드로 점프
  const connected = [...new Set(LINKS
    .filter(l => l.type === 'link' && (idOf(l.source) === node.id || idOf(l.target) === node.id))
    .map(l => idOf(l.source) === node.id ? idOf(l.target) : idOf(l.source)))];
  if (connected.length) {
    const wrap = document.createElement('div');
    wrap.className = 'dt-links';
    wrap.append('🔗 연결: ');
    for (const id of connected) {
      const n = NODES.find(x => x.id === id);
      const chip = document.createElement('span');
      chip.className = 'dt-link';
      chip.textContent = (n && n.label) || id;
      chip.addEventListener('click', () => focusNode(id));
      wrap.append(chip, ' ');
    }
    detailEl.appendChild(wrap);
  }
}
</script>
</body>
</html>
