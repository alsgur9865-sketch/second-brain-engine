# File: pyproject.toml
[project]
name = "second-brain-engine"
version = "0.1.0"
description = "A general-purpose second-brain engine with semantic search"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
